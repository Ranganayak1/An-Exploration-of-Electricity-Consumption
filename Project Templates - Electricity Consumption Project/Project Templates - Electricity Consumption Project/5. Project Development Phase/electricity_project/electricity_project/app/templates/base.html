<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}India Electricity Consumption Analytics{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand">⚡ India Electricity Consumption Analytics</div>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
  <ul class="navbar-links" id="navLinks">
    <li><a href="{{ url_for('index') }}">Overview</a></li>
    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li><a href="{{ url_for('story') }}">Data Story</a></li>
  </ul>
</nav>

<main class="page-content">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>India Electricity Consumption Analysis &middot; Jan 2019 &ndash; Dec 2020 &middot; Data Integration, SQL, Visualization &amp; Flask Web Integration Project</p>
</footer>

<script>
document.getElementById('navToggle').addEventListener('click', function () {
  document.getElementById('navLinks').classList.toggle('open');
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
